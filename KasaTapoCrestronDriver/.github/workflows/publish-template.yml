name: Publish template package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version override for a manual pack run.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
              $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          elseif ('${{ inputs.version }}') {
              $version = '${{ inputs.version }}'
          }
          else {
              $version = '0.0.0-ci.' + (Get-Date -Format 'yyyyMMddHHmmss')
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Pack template
        shell: pwsh
        run: |
          dotnet pack .\templatepack.csproj --configuration Release --output .\artifacts\packages /p:Version=${{ steps.version.outputs.version }}

      - name: Resolve package path
        id: package
        shell: pwsh
        run: |
          $package = Get-ChildItem .\artifacts\packages\*.nupkg |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if (-not $package) {
              throw 'No template package was produced.'
          }

          "path=$($package.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$($package.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: template-package-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release asset
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.path }}
          generate_release_notes: true
