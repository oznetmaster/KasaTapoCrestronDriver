name: Release Package

on:
  workflow_dispatch:
    inputs:
      prepared_release:
        description: Publish the frozen, checksum-verified release assets without rebuilding
        required: false
        type: boolean
        default: false
      prepared_release_tag:
        description: Existing immutable vMAJOR.MINOR.PATCH tag to publish with prepared_release
        required: false
        type: string
      documentation_patch:
        description: Publish only the reviewed NuGet documentation patch; preserve existing runtime binaries and GitHub releases
        required: false
        type: boolean
        default: false
      skip_hardware_checks:
        description: Publish without hardware validation when the processor or local runner is unavailable
        required: false
        type: boolean
        default: false
      hardware_skip_reason:
        description: Reason for skipping hardware checks (required when selected)
        required: false
        type: string
  release:
    types:
      - published

permissions:
  actions: read
  checks: read
  contents: write
  id-token: write

jobs:
  build-and-upload-package:
    # Processor-test releases have their own workflow and never publish NuGet packages.
    if: inputs.documentation_patch != true && inputs.prepared_release != true && !contains(github.event.release.body, '<!-- prepared-artifacts -->') && (github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v'))
    runs-on: windows-latest
    environment: release
    env:
      MANIFESTUTIL_VERSION: 29.0.10
      NET472_REFERENCE_ASSEMBLIES: C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.7.2
      NETFX_RUNTIME_DIR: C:\Windows\Microsoft.NET\Framework64\v4.0.30319
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify configured release checks
        shell: pwsh
        working-directory: ${{ github.workspace }}/.
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RELEASE_CHECKS: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          REQUIRED_HOSTED_WORKFLOWS: '["tests.yml","workflow-discovery.yml"]'
          RELEASE_SKIP_HARDWARE_CHECKS: ${{ inputs.skip_hardware_checks }}
          RELEASE_HARDWARE_SKIP_REASON: ${{ inputs.hardware_skip_reason }}
        run: '& ./.github/scripts/Wait-RequiredReleaseChecks.ps1'
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install ILRepack tool
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ilrepack --version 2.0.45
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install ManifestUtil package
        shell: pwsh
        run: |
          nuget install Crestron.DeviceDrivers.ManifestUtil -Version $env:MANIFESTUTIL_VERSION -OutputDirectory "$env:RUNNER_TEMP\nuget-tools"

      - name: Resolve complete ManifestUtil package
        id: manifestutil
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP "nuget-tools\Crestron.DeviceDrivers.ManifestUtil.$env:MANIFESTUTIL_VERSION\tools\net8.0\any"
          $manifestUtil = Join-Path $toolRoot 'ManifestUtil.exe'
          foreach ($required in @('ManifestUtil.exe', 'ManifestUtil.dll', 'ManifestUtil.runtimeconfig.json', 'Newtonsoft.Json.Compact.dll')) {
            if (!(Test-Path -LiteralPath (Join-Path $toolRoot $required))) { throw "Incomplete ManifestUtil package: $required" }
          }
          "exe_path=$manifestUtil" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore KasaTapoCrestronDriver/KasaTapoCrestronDriver.csproj

      - name: Write release notes
        id: release_notes
        shell: pwsh
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.txt'
          $notes = $env:RELEASE_BODY
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = Get-Content RELEASE-NOTES.md -Raw }
          if ([string]::IsNullOrWhiteSpace($notes)) { throw 'NuGet release notes are required for every release trigger.' }
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8NoBOM -NoNewline
          "path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Verify driver version rules
        shell: pwsh
        run: |
          ./tools/Test-DriverVersioning.ps1
          ./tools/Test-DistributionVersioning.ps1

      - name: Determine release version
        id: package_version
        shell: pwsh
        run: |
          $refName = if ($env:GITHUB_EVENT_NAME -eq 'release' -and $env:GITHUB_EVENT_PATH) {
            (Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json).release.tag_name
          } else { $env:GITHUB_REF_NAME }
          $selected = & ./tools/Get-DriverReleaseVersion.ps1 -ManifestPath @('./KasaTapoCrestronDriver/KasaTapoCrestronDriver.json') -Tag $refName -RequireTag:($env:GITHUB_EVENT_NAME -eq 'release')
          & ./tools/Assert-PublicDistributionVersion.ps1 -ReleaseVersion $selected.PackageVersion
          "value=$($selected.PackageVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "driver=$($selected.DriverReleaseVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$($selected.Tag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build release package
        shell: pwsh
        run: |
          # Build only the driver project (not the whole solution) so MSBuild doesn't also build the
          # KasaTapoCrestronDriver.Tests project's SkipMergeDependencies=true ProjectReference to this same
          # project as a second, parallel instance - that second instance writes to the same obj/bin outputs
          # as this build and previously caused a CS2012 file-lock error ("... KasaTapoCrestronDriver.dll for
          # writing ... locked by VBCSCompiler").
          dotnet build KasaTapoCrestronDriver/KasaTapoCrestronDriver.csproj -c Release -p:ManifestUtilExe="${{ steps.manifestutil.outputs.exe_path }}" -p:LocalNet472ReferenceAssemblies="$env:NET472_REFERENCE_ASSEMBLIES" -p:LocalNetFxRuntimeDir="$env:NETFX_RUNTIME_DIR" -p:MergeDependenciesContinueOnError=false -p:PackageDriverContinueOnError=false -p:PackageDriverIgnoreExitCode=false -p:DriverReleaseVersion="${{ steps.package_version.outputs.driver }}"

      - name: Locate package
        id: package
        shell: pwsh
        run: |
          $pkg = Get-Item -LiteralPath "$env:GITHUB_WORKSPACE\KasaTapoCrestronDriver\bin\Release\net472\NeilColvin_Platform_KasaTapo_IP_V2.pkg" -ErrorAction Stop
          if ($null -eq $pkg) {
            throw 'No .pkg file was generated in KasaTapoCrestronDriver/bin/Release.'
          }

          & ./tools/Normalize-DriverPackage.ps1 -PackagePath $pkg.FullName
          & ./tools/Assert-DriverPackageVersion.ps1 -PackagePath $pkg.FullName -ManifestPath './KasaTapoCrestronDriver/KasaTapoCrestronDriver.json' -ReleaseVersion '${{ steps.package_version.outputs.value }}'

          "pkg_path=$($pkg.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8


      - name: Pack NuGet package
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP 'nuget-package'
          $manifestPath = Join-Path $env:RUNNER_TEMP 'crestron-driver-package.json'
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          $manifest = @{
            standardVersion = '1.0'
            packageType = 'CrestronHomeDriver'
            driverPlatform = 'Crestron Home'
            payloadType = 'pkg'
            payloadFile = [System.IO.Path]::GetFileName("${{ steps.package.outputs.pkg_path }}")
            containsManagedDllPayload = $false
            packageId = 'CrestronHomeDriver.TpLink.KasaTapoPlatform'
            packageVersion = "${{ steps.package_version.outputs.value }}"
            displayName = 'Kasa/Tapo Platform Driver'
            vendor = 'TP-Link'
            driverCategory = 'Lighting'
          } | ConvertTo-Json -Depth 5

          Set-Content -Path $manifestPath -Value $manifest -Encoding UTF8

          dotnet pack KasaTapoCrestronDriver/KasaTapoCrestronDriver.csproj -c Release --no-build --output $outputDir -p:PackageVersion="${{ steps.package_version.outputs.value }}" -p:PackageDriverPkgPath="${{ steps.package.outputs.pkg_path }}" -p:PackageDriverManifestPath="$manifestPath" -p:PackageReleaseNotesFile="${{ steps.release_notes.outputs.path }}"
          if ($LASTEXITCODE -ne 0) { throw 'NuGet pack failed.' }
          $packages = @(Get-ChildItem -LiteralPath $outputDir -Filter *.nupkg -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one NuGet package.' }
          ./tools/Test-NuGetDocumentation.ps1 -PackagePath $packages[0].FullName

      - name: Locate NuGet package
        id: nuget_package
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'nuget-package') -Filter *.nupkg -File |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if ($null -eq $nupkg) {
            throw 'No NuGet package (.nupkg) was generated.'
          }

          "nupkg_path=$($nupkg.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Generate short-lived NuGet API key (Trusted Publishing)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'Trusted Publishing did not return a NuGet API key.'
          }

          dotnet nuget push "${{ steps.nuget_package.outputs.nupkg_path }}" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: KasaTapoCrestronDriver-pkg
          path: ${{ steps.package.outputs.pkg_path }}
          if-no-files-found: error

      - name: Upload package asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: ${{ steps.package.outputs.pkg_path }}
          fail_on_unmatched_files: true

  prepared-release:
    if: github.event_name == 'workflow_dispatch' && inputs.prepared_release == true && inputs.documentation_patch != true
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.prepared_release_tag }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Verify configured release checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RELEASE_CHECKS: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          REQUIRED_HOSTED_WORKFLOWS: '["tests.yml","workflow-discovery.yml"]'
          RELEASE_SKIP_HARDWARE_CHECKS: ${{ inputs.skip_hardware_checks }}
          RELEASE_HARDWARE_SKIP_REASON: ${{ inputs.hardware_skip_reason }}
        run: '& ./.github/scripts/Wait-RequiredReleaseChecks.ps1'
      - name: Download and verify frozen assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_RELEASE_TAG: ${{ inputs.prepared_release_tag }}
        run: |
          $plan = Get-Content FrozenRelease.json -Raw | ConvertFrom-Json
          $tag = 'v' + $plan.publicVersion
          if ($env:PREPARED_RELEASE_TAG -cne $tag) { throw 'Select the exact immutable prepared-release tag.' }
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -or $source -notmatch '^[a-f0-9]{40}$') { throw 'Cannot resolve the prepared source.' }
          # Draft releases are returned by the authenticated list endpoint; lookup
          # by tag can return 404 until publication.
          $pages = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Draft listing failed.' }
          $matching = @($pages | ForEach-Object { $_ } | Where-Object { $_.tag_name -ceq $tag })
          if ($matching.Count -ne 1) { throw 'Expected exactly one prepared release.' }
          $release = $matching[0]
          if (!$release.draft -or $release.target_commitish -ne $source -or !$release.body.Contains('<!-- prepared-artifacts -->')) { throw 'Expected the prepared draft on this exact source.' }
          $directory = Join-Path $PWD 'artifacts/frozen-release'
          New-Item -ItemType Directory -Path $directory | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir $directory
          if ($LASTEXITCODE) { throw 'Prepared release download failed.' }
          ./tools/Test-FrozenRelease.ps1 -ArtifactDirectory $directory
      - uses: NuGet/login@v1
        id: prepared-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish verified NuGet package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.prepared-login.outputs.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw 'Trusted Publishing did not return an API key.' }
          $plan = Get-Content FrozenRelease.json -Raw | ConvertFrom-Json
          dotnet nuget push "artifacts/frozen-release/CrestronHomeDriver.TpLink.KasaTapoPlatform.$($plan.publicVersion).nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE) { throw 'Frozen NuGet publication failed; inspect before retrying.' }
      - name: Publish prepared GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $plan = Get-Content FrozenRelease.json -Raw | ConvertFrom-Json
          gh release edit "v$($plan.publicVersion)" --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE) { throw 'GitHub publication failed; do not repeat the NuGet push.' }

  nuget-documentation:
    if: github.event_name == 'workflow_dispatch' && inputs.documentation_patch == true
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Build and verify documentation-only package
        shell: pwsh
        run: ./tools/New-NuGetDocumentationPatch.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-documentation-patch
          path: artifacts/nuget-documentation/*
          if-no-files-found: error
      - uses: NuGet/login@v1
        id: documentation-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish verified NuGet documentation patch
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.documentation-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem artifacts/nuget-documentation -Filter *.nupkg -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one verified package.' }
          dotnet nuget push $packages[0].FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet documentation patch publication failed.' }
