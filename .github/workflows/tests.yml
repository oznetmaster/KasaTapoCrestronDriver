name: Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: driver
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
      - name: Test shared driver versioning policy
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: driver-versioning-regressions
          root: driver
      - name: Test public driver packaging policy
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: public-driver-packaging-regressions
          root: driver
      - uses: actions/checkout@v4
        with:
          repository: oznetmaster/CrestronHomeNUnit
          ref: d268167a15df665acfb4506a53d238cea833a42f
          path: CrestronHomeNUnit
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: NuGet/setup-nuget@v2
      - name: Install processor packaging tools
        run: ../CrestronHomeNUnit/tools/InstallCiTools.ps1
      - name: Build read-only installed-control probe
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-tests-build-read-only-installed-control-probe
          root: driver
      - name: Compile optional Android app fixtures
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-tests-compile-optional-android-app-fixtures
          root: driver
      - name: Verify offline app evidence contracts
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-tests-verify-offline-app-evidence-contracts
          root: driver
      - name: Verify discovery coverage guards
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-tests-verify-discovery-coverage-guards
          root: driver
      - name: Run discovered NUnit driver tests
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-tests-run-discovered-nunit-driver-tests
          root: driver
      - name: Restore public desktop SDK dependency
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'kasa-public-tools'
          nuget install Crestron.DeviceDrivers.ManifestUtil -Version 29.0.10 -OutputDirectory $tools -NonInteractive -Source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'ManifestUtil package installation failed.' }
          $runtime = Join-Path $tools 'Crestron.DeviceDrivers.ManifestUtil.29.0.10/tools/net8.0/any'
          $compact = Join-Path $runtime 'Newtonsoft.Json.Compact.dll'
          if ((Get-FileHash -LiteralPath $compact -Algorithm SHA256).Hash -ne '8b9567057419e97b20702a4364283b0b5c34d5e00e006e329e1c92b74638ef90') { throw 'Unexpected desktop SDK dependency checksum.' }
          "CompactJsonPath=$compact" >> $env:GITHUB_ENV
          "MANIFEST_UTIL_EXE=$(Join-Path $runtime 'ManifestUtil.exe')" >> $env:GITHUB_ENV
      - name: Run discovered desktop SDK lifecycle harness
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-tests-run-discovered-desktop-sdk-lifecycle-harness
          root: driver
      - name: Build processor package
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-tests-build-processor-package
          root: driver
      - name: Validate all packaged suites
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-tests-validate-all-packaged-suites
          root: driver
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: driver/TestResults
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KasaTapoCrestronDriver-processor-tests
          path: driver/KasaTapoCrestronDriver.ProcessorTests/bin/Release/net472/KasaTapoCrestronDriver.ProcessorTests.pkg
          if-no-files-found: error
