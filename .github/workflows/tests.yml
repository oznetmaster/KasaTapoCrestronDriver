name: Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: driver
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
      - uses: actions/checkout@v4
        with:
          repository: oznetmaster/CrestronHomeNUnit
          ref: ce916780ebafc78306fff11e614f3eef20ca2092
          path: CrestronHomeNUnit
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: NuGet/setup-nuget@v2
      - name: Install processor packaging tools
        run: ../CrestronHomeNUnit/tools/InstallCiTools.ps1
      - name: Build read-only installed-control probe
        run: dotnet build KasaTapoCrestronDriver.ControlProbe/KasaTapoCrestronDriver.ControlProbe.csproj -c Release
      - name: Compile optional Android app fixtures
        run: dotnet build KasaTapoCrestronDriver.AndroidTests/KasaTapoCrestronDriver.AndroidTests.csproj -c Release
      - name: Verify offline app evidence contracts
        run: dotnet test KasaTapoCrestronDriver.AndroidTests/KasaTapoCrestronDriver.AndroidTests.csproj -c Release --no-build --filter FullyQualifiedName~KasaAppEvidenceContracts --logger "trx;LogFileName=app-evidence-contracts.trx" --results-directory TestResults/AppEvidence
      - name: Verify discovery coverage guards
        run: ./tools/Test-DiscoveredCoverageGuards.ps1
      - name: Run discovered NUnit driver tests
        run: ./tools/Test-DiscoveredCoverage.ps1 -Stage Desktop -Project KasaTapoCrestronDriver.Tests/KasaTapoCrestronDriver.Tests.csproj -Framework net472 -ExcludeProcessor -ResultsDirectory TestResults
      - name: Restore public desktop SDK dependency
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'kasa-public-tools'
          nuget install Crestron.DeviceDrivers.ManifestUtil -Version 29.0.10 -OutputDirectory $tools -NonInteractive -Source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'ManifestUtil package installation failed.' }
          $runtime = Join-Path $tools 'Crestron.DeviceDrivers.ManifestUtil.29.0.10/tools/net8.0/any'
          $compact = Join-Path $runtime 'Newtonsoft.Json.Compact.dll'
          if ((Get-FileHash -LiteralPath $compact -Algorithm SHA256).Hash -ne '8b9567057419e97b20702a4364283b0b5c34d5e00e006e329e1c92b74638ef90') { throw 'Unexpected desktop SDK dependency checksum.' }
          "CompactJsonPath=$compact" >> $env:GITHUB_ENV
          "MANIFEST_UTIL_EXE=$(Join-Path $runtime 'ManifestUtil.exe')" >> $env:GITHUB_ENV
      - name: Run discovered desktop SDK lifecycle harness
        run: ./tools/Test-DiscoveredCoverage.ps1 -Stage Desktop -Project KasaTapoCrestronDriver.Lifecycle.Tests/KasaTapoCrestronDriver.Lifecycle.Tests.csproj -Framework net10.0 -RequiredCategories unit -CompareProcessorInventory TestResults/KasaTapoCrestronDriver.Tests/inventory.json -ResultsDirectory TestResults
      - name: Build processor package
        run: |
          dotnet build KasaTapoCrestronDriver.ProcessorTests/KasaTapoCrestronDriver.ProcessorTests.csproj -c Release -p:BuildProcessorTestPackages=true -p:ReleaseVersion=1.3.0 -p:DeployAfterBuild=false "-p:ManifestUtilExe=$env:MANIFEST_UTIL_EXE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate all packaged suites
        run: |
          $output = Join-Path $PWD 'KasaTapoCrestronDriver.ProcessorTests/bin/Release/net472'
          $extracted = Join-Path $env:RUNNER_TEMP 'driver-package-tests'
          [IO.Compression.ZipFile]::ExtractToDirectory((Join-Path $output 'KasaTapoCrestronDriver.ProcessorTests.pkg'), $extracted)
          ./tools/Test-DiscoveredCoverage.ps1 -Stage Package -SdkRoot ../CrestronHomeNUnit -PackageAssembly (Join-Path $extracted 'KasaTapoCrestronDriver.ProcessorTests.dll') -SourceInventory TestResults/KasaTapoCrestronDriver.Tests/inventory.json -SuiteCategories @{'kasatapodriver'='unit';'kasatapodriver-lifecycle'='processor';'kasatapodriver-live'='live'} -DiscoveryOnly -ResultsDirectory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: driver/TestResults
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KasaTapoCrestronDriver-processor-tests
          path: driver/KasaTapoCrestronDriver.ProcessorTests/bin/Release/net472/KasaTapoCrestronDriver.ProcessorTests.pkg
          if-no-files-found: error
