name: Workflow discovery
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submission-discovery:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Discover submission tests without private settings or equipment
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: workflow-discovery-submission-discovery-discover-submission-tests-without-private-settings-or-equipment
  discover:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: KasaTapoCrestronDriver.WorkflowTests/KasaTapoCrestronDriver.WorkflowTests.csproj
            expected: KasaTapoCrestronDriver processor workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify offline Test Explorer discovery
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: workflow-discovery-discover-verify-offline-test-explorer-discovery
        env:
          WORKFLOW_PROJECT: ${{ matrix.project }}
          EXPECTED_WORKFLOW: ${{ matrix.expected }}
